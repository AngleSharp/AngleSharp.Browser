<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Diagnostics</title>
<style>
{{styles}}

.cards {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-bottom: 14px;
}

.card {
  padding: 8px 10px;
  border-radius: 10px;
  background: var(--surface);
}

.card .value {
  font-size: 17px;
  font-weight: 600;
}

.card .label {
  color: var(--muted);
  font-size: 11px;
}

.card.alert {
  background: var(--danger-soft);
}

.card.alert .value {
  color: var(--danger);
}

.facts .fact {
  padding: 6px 0;
  border-bottom: 1px solid var(--border);
}

.facts .fact:last-child {
  border-bottom: 0;
}

.fact .label {
  color: var(--muted);
  font-size: 11px;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.fact .value {
  word-break: break-all;
}

.entry {
  padding: 8px 0;
  border-bottom: 1px solid var(--border);
}

.entry:last-child {
  border-bottom: 0;
}

.entry-head {
  display: flex;
  align-items: center;
}

.entry .name {
  flex: 1;
  overflow: hidden;
  font-weight: 600;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.entry .url,
.entry .meta {
  color: var(--muted);
  font-size: 11px;
  word-break: break-all;
}

.status {
  margin-right: 6px;
  padding: 0 6px;
  border-radius: 4px;
  font-size: 11px;
  font-weight: 700;
  line-height: 17px;
}

.status.ok {
  background: var(--success-soft);
  color: var(--success);
}

.status.redirect,
.status.pending {
  background: var(--warning-soft);
  color: var(--warning);
}

.status.failed {
  background: var(--danger-soft);
  color: var(--danger);
}

.message {
  padding: 8px 10px;
  margin-bottom: 6px;
  border-radius: 8px;
  background: var(--surface);
  word-break: break-all;
}

.message.error {
  background: var(--danger-soft);
  color: var(--danger);
}

.message .time {
  display: block;
  color: var(--muted);
  font-size: 10px;
}

.console .message {
  font-family: var(--mono);
  font-size: 12px;
}

.message .head {
  font-weight: 600;
}

.message .where {
  margin-top: 2px;
  font-family: var(--mono);
  font-size: 11px;
}

.message .stack {
  margin: 4px 0 0;
  padding-top: 4px;
  border-top: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 11px;
  white-space: pre-wrap;
  word-break: break-all;
}

.message .repeat {
  margin-left: 6px;
}

.summary {
  margin-bottom: 8px;
  color: var(--muted);
  font-size: 12px;
}

.waterfall {
  position: relative;
}

.axis {
  position: relative;
  height: 16px;
  margin-bottom: 2px;
  color: var(--muted);
  font-size: 10px;
}

.axis span {
  position: absolute;
  top: 0;
}

.gridline {
  position: absolute;
  top: 16px;
  bottom: 0;
  width: 1px;
  background: var(--border);
}

.gridline.paint {
  background: var(--series-2);
}

.request {
  position: relative;
  padding: 4px 0;
  cursor: pointer;
}

.request:hover {
  background: var(--surface);
}

.request-head {
  display: flex;
  align-items: center;
  font-size: 12px;
}

.request-head .name {
  flex: 1 1 0;
  min-width: 0;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.request-head .took {
  margin-left: 6px;
  color: var(--muted);
  font-size: 11px;
}

.track {
  position: relative;
  height: 6px;
  margin-top: 3px;
}

.bar {
  position: absolute;
  top: 0;
  height: 6px;
  min-width: 2px;
  border-radius: 3px;
  background: var(--series-1);
}

.bar.failed {
  background: var(--danger);
}

.bar.pending {
  background: var(--muted);
}

.request-details {
  position: relative;
  margin-top: 6px;
  padding: 6px 8px;
  border-radius: 6px;
  background: var(--surface);
  font-size: 11px;
  cursor: text;
}

.request-details .label {
  margin-top: 6px;
  color: var(--muted);
  letter-spacing: 0.04em;
  text-transform: uppercase;
}

.request-details .line {
  word-break: break-all;
}

.request-details .key {
  color: var(--muted);
}

.chart-title {
  display: flex;
  justify-content: space-between;
  margin-bottom: 4px;
  font-size: 12px;
  font-weight: 600;
}

.legend {
  color: var(--muted);
  font-size: 11px;
  font-weight: 400;
}

.swatch {
  display: inline-block;
  width: 8px;
  height: 8px;
  margin: 0 3px 0 8px;
  border-radius: 2px;
}

.swatch.layout {
  background: var(--series-1);
}

.swatch.raster {
  background: var(--series-2);
}

.plot {
  position: relative;
  display: flex;
  align-items: flex-end;
  height: 120px;
  margin-bottom: 4px;
  border-bottom: 1px solid var(--border);
}

.plot .budget {
  position: absolute;
  left: 0;
  right: 0;
  height: 1px;
  background: var(--muted);
}

.plot .scale {
  position: absolute;
  right: 0;
  color: var(--muted);
  font-size: 10px;
}

.frame {
  display: flex;
  flex: 0 0 5px;
  flex-direction: column;
  justify-content: flex-end;
  height: 100%;
}

.frame:hover {
  background: var(--surface);
}

.frame .segment {
  width: 3px;
  border-radius: 1px 1px 0 0;
}

.frame .layout {
  background: var(--series-1);
}

.frame .raster {
  margin-bottom: 2px;
  background: var(--series-2);
}

.frame .tip {
  display: none;
  position: absolute;
  top: 0;
  left: 0;
  padding: 2px 6px;
  border-radius: 4px;
  background: var(--surface-strong);
  font-size: 11px;
}

.frame:hover .tip {
  display: block;
}

.frame-row {
  display: flex;
  padding: 3px 0;
  border-bottom: 1px solid var(--border);
  font-size: 12px;
}

.frame-row span {
  flex: 1 1 0;
  min-width: 0;
  padding-right: 6px;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.frame-row.head {
  color: var(--muted);
  font-size: 11px;
}

.section {
  margin: 14px 0 4px;
  color: var(--muted);
  font-size: 11px;
  letter-spacing: 0.04em;
  text-transform: uppercase;
}
</style>
</head>
<body>
  <header class="top">
    <div class="title-row">
      <h1>Diagnostics</h1>
      <button type="button" class="button small" id="clear">Clear</button>
    </div>
    <nav class="tabs">
      <button type="button" class="tab active" id="tab-overview">Page</button>
      <button type="button" class="tab" id="tab-errors">Errors <span class="badge" id="count-errors">0</span></button>
      <button type="button" class="tab" id="tab-console">Console <span class="badge" id="count-console">0</span></button>
      <button type="button" class="tab" id="tab-network">Network <span class="badge" id="count-network">0</span></button>
      <button type="button" class="tab" id="tab-performance">Rendering <span class="badge" id="count-performance">0</span></button>
    </nav>
  </header>

  <section class="panel active" id="panel-overview">
    <div class="cards" id="cards"></div>
    <div class="facts" id="facts"></div>
  </section>

  <section class="panel" id="panel-errors">
    <div id="errors"></div>
  </section>

  <section class="panel console" id="panel-console">
    <div id="console"></div>
  </section>

  <section class="panel" id="panel-network">
    <div id="network"></div>
  </section>

  <section class="panel" id="panel-performance">
    <div id="performance"></div>
  </section>
</body>
</html>
