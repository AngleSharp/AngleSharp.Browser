<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Vision pages</title>
<style>
{{styles}}

html,
body {
  background: var(--surface);
}

.page {
  max-width: 680px;
  margin: 0 auto;
  padding: 28px 24px 24px;
}

.intro {
  margin-bottom: 20px;
}

.intro h1 {
  font-size: 22px;
  font-weight: 500;
}

.intro p {
  margin: 4px 0 0;
}

.notice {
  margin-bottom: 16px;
  padding: 12px 16px;
  border-radius: 12px;
  background: var(--warning-soft);
  color: var(--warning);
}

.list {
  border-radius: 14px;
  background: var(--bg);
  border: 1px solid var(--border);
}

.item {
  display: block;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  color: var(--text);
}

.item:last-child {
  border-bottom: 0;
}

.item:hover {
  background: var(--accent-soft);
}

.item .name {
  font-weight: 600;
}

.item .address {
  margin-left: 8px;
  color: var(--accent);
  font-family: var(--mono);
  font-size: 12px;
}

.item .description {
  display: block;
  margin-top: 2px;
  color: var(--muted);
  font-size: 12px;
}
</style>
</head>
<body>
  <div class="page">
    <div class="intro">
      <h1>Vision pages</h1>
      <p class="muted">The browser's own pages, which are available at addresses starting with vision:.</p>
    </div>
    {{notice}}
    <div class="list" id="pages">{{pages}}</div>
  </div>
</body>
</html>
