<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Start</title>
<style>
{{styles}}

html,
body {
  background: var(--surface);
}

.hero {
  padding: 40px 24px 76px;
  background: #0b57d0;
  background: linear-gradient(135deg, #0b57d0 0%, #5b3fd6 55%, #a142c7 100%);
  color: #ffffff;
  text-align: center;
}

.hero .logo {
  display: inline-block;
  border-radius: 18px;
  box-shadow: 0 8px 24px rgba(20, 10, 80, 0.35);
}

.hero .logo img {
  display: block;
  width: 72px;
  height: 72px;
}

.hero h1 {
  margin-top: 14px;
  font-size: 30px;
  font-weight: 600;
  letter-spacing: -0.01em;
}

.hero p {
  margin: 6px 0 0;
  color: #e4e1ff;
  font-size: 14px;
}

.page {
  max-width: 852px;
  margin: -48px auto 0;
  padding: 0 24px 32px;
}

.section {
  margin-bottom: 20px;
  padding: 20px 20px 8px;
  border: 1px solid var(--border);
  border-radius: 18px;
  background: var(--bg);
  box-shadow: 0 2px 10px rgba(32, 33, 36, 0.08);
}

.section h2 {
  font-size: 15px;
}

.section .hint {
  margin: 2px 0 14px;
  color: var(--muted);
  font-size: 12px;
}

.tiles {
  display: flex;
  flex-wrap: wrap;
  margin: 0 -6px;
}

.tile {
  display: flex;
  box-sizing: border-box;
  width: 262px;
  margin: 0 6px 12px;
  padding: 14px;
  border: 1px solid var(--border);
  border-radius: 14px;
  background: var(--surface);
  color: var(--text);
}

.tile:hover {
  border-color: var(--accent);
  background: var(--accent-soft);
  box-shadow: 0 4px 14px rgba(11, 87, 208, 0.18);
}

.tile .letter {
  display: block;
  flex: none;
  width: 40px;
  height: 40px;
  margin-right: 12px;
  border-radius: 12px;
  box-shadow: 0 2px 6px rgba(0, 0, 0, 0.2);
  color: #ffffff;
  font-size: 18px;
  font-weight: 600;
  line-height: 40px;
  text-align: center;
}

.tile .text {
  display: block;
  flex: 1;
  min-width: 0;
}

.tile .name,
.tile .address {
  display: block;
  overflow: hidden;
  white-space: nowrap;
  text-overflow: ellipsis;
}

.tile .name {
  font-weight: 600;
}

.tile .address {
  color: var(--accent);
  font-family: var(--mono);
  font-size: 11px;
}

.tile .description {
  display: block;
  margin-top: 4px;
  color: var(--muted);
  font-size: 12px;
}

.section .empty {
  margin: 0 0 12px;
  padding: 18px;
  border: 1px dashed var(--border);
  border-radius: 14px;
  text-align: left;
}
</style>
</head>
<body>
  <div class="hero">
    <div class="logo"><img src="{{logo}}" alt="Vision logo"></div>
    <h1>Vision</h1>
    <p>A browser made of AngleSharp. Type an address above, or pick a page to start with.</p>
  </div>

  <div class="page">
    <div class="section">
      <h2>Most visited</h2>
      <p class="hint">The pages you come back to.</p>
      <div class="tiles" id="most-visited">{{most-visited}}</div>
    </div>

    <div class="section">
      <h2>Demos</h2>
      <p class="hint">Sites showing what the engine can do.</p>
      <div class="tiles" id="demos">{{demos}}</div>
    </div>

    <div class="section">
      <h2>Vision</h2>
      <p class="hint">The tools and settings of this browser.</p>
      <div class="tiles" id="pages">{{pages}}</div>
    </div>
  </div>
</body>
</html>
