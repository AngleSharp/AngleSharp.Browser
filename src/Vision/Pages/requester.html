<!doctype html>
<html>
<head>
<meta charset="utf-8">
<title>Requester</title>
<style>
{{styles}}

html,
body {
  background: var(--surface);
}

.page {
  max-width: 960px;
  margin: 0 auto;
  padding: 28px 24px 24px;
}

.intro {
  margin-bottom: 20px;
}

.intro h1 {
  font-size: 22px;
  font-weight: 500;
}

.intro p {
  margin: 4px 0 0;
}

.card {
  margin-bottom: 16px;
  padding: 16px 20px;
  border-radius: 14px;
  background: var(--bg);
  border: 1px solid var(--border);
}

.line {
  display: flex;
  align-items: center;
}

.field {
  box-sizing: border-box;
  padding: 8px 12px;
  border: 1px solid var(--border);
  border-radius: 8px;
  background: var(--bg);
  color: var(--text);
  font-family: inherit;
  font-size: 13px;
}

select.field {
  padding: 7px 8px;
}

.line .method {
  width: 110px;
  margin-right: 8px;
  font-weight: 600;
}

.line .url {
  flex: 1;
  min-width: 0;
  margin-right: 8px;
  font-family: var(--mono);
  font-size: 12px;
}

.line .button {
  width: 88px;
  text-align: center;
}

.options {
  display: flex;
  align-items: center;
  margin-top: 12px;
}

.options .label {
  margin-right: 8px;
  color: var(--muted);
}

.options .requester {
  width: 200px;
  margin-right: 20px;
}

.check {
  display: flex;
  align-items: center;
  cursor: pointer;
}

.check input {
  margin: 0 8px 0 0;
}

.editors {
  display: flex;
  margin-top: 12px;
}

.editor {
  flex: 1;
  min-width: 0;
}

.editor + .editor {
  margin-left: 12px;
}

.editor .label {
  display: block;
  font-weight: 600;
}

.editor .hint {
  display: block;
  color: var(--muted);
  font-size: 12px;
}

.editor textarea.field {
  display: block;
  width: 100%;
  height: 120px;
  margin-top: 6px;
  font-family: var(--mono);
  font-size: 12px;
}

.status {
  display: block;
  margin-top: 12px;
  color: var(--muted);
}

.status:empty {
  display: none;
}

.status.invalid {
  color: var(--danger);
  font-weight: 600;
}

.response.hidden {
  display: none;
}

.summary {
  display: flex;
  align-items: center;
  padding-bottom: 8px;
}

.code {
  margin-right: 12px;
  padding: 2px 10px;
  border-radius: 10px;
  font-weight: 600;
}

.code.success {
  background: var(--success-soft);
  color: var(--success);
}

.code.redirect {
  background: var(--warning-soft);
  color: var(--warning);
}

.code.failure {
  background: var(--danger-soft);
  color: var(--danger);
}

.address {
  margin-top: 2px;
  color: var(--muted);
  font-family: var(--mono);
  font-size: 11px;
  word-break: break-all;
}

.response .tabs {
  margin-top: 8px;
  border-bottom: 1px solid var(--border);
}

.response .panel {
  padding: 12px 0 0;
}

pre {
  margin: 0;
  padding: 12px;
  border-radius: 8px;
  background: var(--surface);
  font-family: var(--mono);
  font-size: 12px;
  white-space: pre-wrap;
  word-break: break-all;
}

.header {
  display: flex;
  padding: 4px 0;
  border-bottom: 1px solid var(--border);
  font-family: var(--mono);
  font-size: 12px;
}

.header:last-child {
  border-bottom: 0;
}

.header .name {
  flex: none;
  width: 220px;
  margin-right: 12px;
  font-weight: 600;
  word-break: break-all;
}

.header .value {
  flex: 1;
  min-width: 0;
  word-break: break-all;
}

.request-line {
  margin-bottom: 8px;
  font-family: var(--mono);
  font-size: 12px;
  font-weight: 600;
  word-break: break-all;
}
</style>
</head>
<body>
  <div class="page">
    <div class="intro">
      <h1>Requester</h1>
      <p class="muted">Send requests with the requesters of this window, which add its user agent and default headers like they do for pages.</p>
    </div>

    <div class="card">
      <div class="line">
        <select class="field method" id="method">{{methods}}</select>
        <input type="text" class="field url" id="url" value="https://httpbin.org/get" placeholder="https://example.org/api">
        <button type="button" class="button primary" id="send">Send</button>
      </div>
      <div class="options">
        <span class="label">Requester</span>
        <select class="field requester" id="requester"></select>
        <label class="check"><input type="checkbox" id="cookies" checked>Send and keep the cookies of the browser</label>
      </div>
      <div class="editors">
        <div class="editor">
          <span class="label">Headers</span>
          <span class="hint">One "Name: value" per line.</span>
          <textarea class="field" id="headers">Accept: application/json</textarea>
        </div>
        <div class="editor">
          <span class="label">Body</span>
          <span class="hint">Sent as UTF-8. Without a Content-Type, as JSON if it starts with { or [.</span>
          <textarea class="field" id="body"></textarea>
        </div>
      </div>
      <span class="status" id="status"></span>
    </div>

    <div class="card response hidden" id="response">
      <div class="summary">
        <span class="code" id="response-status"></span>
        <span class="muted" id="response-info"></span>
      </div>
      <div class="address" id="response-address"></div>
      <div class="tabs">
        <button type="button" class="tab active" id="tab-body">Body</button>
        <button type="button" class="tab" id="tab-headers">Headers <span class="badge">0</span></button>
        <button type="button" class="tab" id="tab-request">Request</button>
      </div>
      <div class="panel active" id="panel-body"><pre id="body-text"></pre></div>
      <div class="panel" id="panel-headers"><div id="headers-list"></div></div>
      <div class="panel" id="panel-request">
        <div class="request-line" id="request-line"></div>
        <div id="request-headers"></div>
      </div>
    </div>
  </div>
</body>
</html>
